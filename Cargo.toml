[package]
name = "nobotrs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
include = ["src/**", "dictionary/**", "tests/**", "scripts/**", "integrations/**", "docs/configuration.md", "docs/core-validation.md", "docs/compression-reference.md", "docs/mtld-reference.md", "docs/readability-reference.md", "docs/rule-catalog.md", "docs/writing-guide.md", "docs/evaluation/**", "/Cargo.toml", "/Cargo.lock", "/build.rs", "/README.md", "/HANDOFF.md", "docs/superpowers/plans/2026-10-10-nobotrs-review-remediation.md", "/LICENSE", "/NOTICE", "/.pre-commit-hooks.yaml"]
license = "MIT"
description = "Detects AI-generated text and lints prose for AI-writing tells"
repository = "https://github.com/kerryhatcher/nobotrs"

[[bin]]
name = "nobotrs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aho-corasick = "1"
regex = "1"
unicode-segmentation = "1"
lzma-rs = "0.3"
directories = "5"
walkdir = "2"
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
lto = true
strip = true
opt-level = "z"
