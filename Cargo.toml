[package]
name = "nobotrs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
include = ["src/**", "dictionary/**", "models/*.json", "models/README.md", "tests/**", "scripts/*.py", "integrations/**/*.py", "integrations/**/*.md", "integrations/**/*.json", "integrations/**/*.toml", "integrations/**/*.yml", "integrations/**/*.yaml", "docs/local-models.md", "docs/configuration.md", "docs/core-validation.md", "docs/integration-validation.md", "docs/compression-reference.md", "docs/mtld-reference.md", "docs/readability-reference.md", "docs/rule-catalog.md", "docs/writing-guide.md", "docs/ai-writing-guide.md", "docs/evaluation/**", "/Cargo.toml", "/Cargo.lock", "/build.rs", "/README.md", "/HANDOFF.md", "docs/superpowers/plans/2026-10-10-nobotrs-review-remediation.md", "/LICENSE", "/NOTICE", "/.pre-commit-hooks.yaml"]
license = "MIT"
description = "Offline heuristic prose linting with uncalibrated writing-tell signals"
repository = "https://github.com/kerryhatcher/nobotrs"

[[bin]]
name = "nobotrs"
path = "src/main.rs"

[features]
default = []
# Native DeBERTa-v3 encoder inference for the pinned Desklib and ConPara models.
models-encoders = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:sha2", "dep:unicode-normalization", "dep:unicode-general-category"]
# Versioned local subprocess adapter for the pinned DetectorScope worker.
models-detectorscope = ["dep:tokenizers", "dep:sha2"]
models = ["models-encoders", "models-detectorscope"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aho-corasick = "1"
regex = "1"
unicode-segmentation = "1"
lzma-rs = "0.3"
directories = "5"
walkdir = "2"
pulldown-cmark = { version = "0.13", default-features = false }
sha2 = { version = "0.10", optional = true }
candle-core = { version = "0.8.4", optional = true }
candle-nn = { version = "0.8.4", optional = true }
candle-transformers = { version = "0.8.4", optional = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"], optional = true }
unicode-normalization = { version = "0.1.25", optional = true }
unicode-general-category = { version = "1.1.0", optional = true }

[profile.release]
lto = true
strip = true
opt-level = "z"
