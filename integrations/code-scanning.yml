# Copy to .github/workflows/prose-sarif.yml; this is an example, not an enabled upload.
name: Prose SARIF
on: [push, pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked --path .
      - name: Scan and preserve operational status
        run: |
          set +e
          nobotrs scan docs --format sarif > prose.sarif
          status=$?
          # Findings are advisory in this example. Fail on operational errors.
          if [ "$status" -eq 2 ]; then exit 2; fi
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: prose.sarif
